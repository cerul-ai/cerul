version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      public-node:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

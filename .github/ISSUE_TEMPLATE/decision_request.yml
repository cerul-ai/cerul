name: Core Design Proposal
description: Propose a change to the core, CLI, data formats, or contributor workflow
title: "[Design] "
labels:
  - decision
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What limitation does this address for users or contributors? Omit private operational details.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options Considered
      description: List the main options and tradeoffs.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended Direction
      description: What is the current recommendation?
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What parts of the system would change?

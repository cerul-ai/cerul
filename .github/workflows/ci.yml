name: Public surface CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Contract, TypeScript SDK, and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli
      - run: cargo test --manifest-path apps/cli/Cargo.toml --locked

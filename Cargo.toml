[package]
name = "cerul"
version = "0.0.14"
edition = "2024"
license = "Apache-2.0"
description = "Searchable video and annotation data, using your own model endpoints"
repository = "https://github.com/cerul-ai/cerul"
homepage = "https://github.com/cerul-ai/cerul"
include = [
    "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
    "/README.md", "/README.zh-CN.md", "/README.zh-TW.md", "/DESIGN.md", "/ARCHITECTURE.md", "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md", "/SECURITY.md",
    "/src/**/*.rs", "/examples/*.rs", "/docs/**/*.md",
    "/packaging/licenses/*.txt", "/scripts/build-*.sh", "/scripts/test-*.py", "/scripts/check-docs.py", "/scripts/package-media-source.sh", "/schemas/*.json", "/prompts/*.md", "/skills/cerul/SKILL.md", "/docs/assets/*.png",
    "/models/det.onnx", "/models/rec.onnx", "/models/characters.txt",
    "/models/LICENSE", "/models/README.md",
    "/models/hands/*.onnx", "/models/hands/LICENSE", "/models/hands/README.md",
    "/tests/*.rs", "/tests/*.py", "/scripts/evaluate-retrieval.py",
    "/tests/fixtures/README.md", "/tests/fixtures/ocr-text.png",
    "/tests/fixtures/hand-opencv.png",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
sha2 = "0.11"
toml = "1.1"
url = "2"
lancedb = { version = "=0.38.0", features = ["remote"] }
# Keep Arrow and Parquet on the major version used by LanceDB.
arrow-array = "58"
arrow-schema = "58"
arrow-json = "58"
arrow-select = "58"
uuid = { version = "1", features = ["v4"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd", "snap"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tract-onnx = "0.23.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
lzma-rs = "0.3"
tar = "0.4"

tempfile = "3"
rpassword = "7"
indicatif = "0.18"
console = { version = "0.16", default-features = false, features = ["std", "ansi-parsing"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
